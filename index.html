<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноPortal | Лучшие фильмы</title>
    <meta name="description" content="Смотрите лучшие фильмы онлайн. Подборки, рейтинги, отзывы.">
    <meta name="keywords" content="Фильмы, Кино, ТОП фильмов, Смотреть онлайн">
    <meta name="author" content="КиноPortal">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236100C2'><path d='M18 3v2h-2V3H8v2H6V3H4v18h16V3h-2zM6 19V7h12v12H6z'/></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="top-bar">
        <div class="dropdown">
            <button class="dropdown-btn" id="dropdownBtn">⋮</button>
        </div>
        <a href="#" class="logo" data-nav="home">
            <span>🎬 КиноPortal</span>
        </a>
        <button id="themeBtn" class="theme-btn">🌙 Тёмная</button>
    </div>

    <div class="side-menu" id="sideMenu">
        <button class="close-menu" id="closeMenuBtn">✕</button>
        <div class="menu-items">
            <a href="#" data-nav="home">Главная</a>
            <a href="#" data-nav="top">25 фильмов</a>
            <a href="#" data-nav="actors">Актёры</a>
            <a href="#" data-nav="feedback">Отзыв</a>
        </div>
    </div>

    <main>
        <section id="home" class="section active">
            <h1>Популярные фильмы</h1>
            <div id="filmsGrid" class="main__films">
                <div class="loading">Загрузка фильмов...</div>
            </div>
        </section>

        <section id="top" class="section">
            <h1>ТОП-25 лучших фильмов</h1>
            <div id="topGrid" class="main__films">
                <div class="loading">Загрузка ТОПа...</div>
            </div>
        </section>

        <section id="actors" class="section">
            <h1>Известные актёры</h1>
            <div id="actorsGrid" class="main__films">
                <div class="loading">Загрузка актёров...</div>
            </div>
        </section>

        <section id="feedback" class="section">
            <h1>Оставить отзыв</h1>
            <div class="feedback-simple">
                <textarea id="reviewText" class="review-input" rows="4" placeholder="Напишите ваш отзыв..."></textarea>
                <button id="sendReviewBtn" class="send-btn">Отправить</button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 КиноPortal | Все лучшие фильмы</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/index.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
